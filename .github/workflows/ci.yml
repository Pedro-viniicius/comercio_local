# CI de todo PR (CA-F8): a ordem do 00-arquitetura (ADR-013) e a auditoria de dependências (S12).
# Sem segredos: nenhum passo lê `secrets.*`, e PR de fork roda com o token só de leitura do
# evento `pull_request` (nunca `pull_request_target`). Banco e e-mail são os containers locais
# do infra/docker-compose.yml; gateway, push e geocodificação usam os falsos.
#
# Actions fixadas pelo SHA do commit (a versão fica no comentário); o Dependabot as atualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Um push novo no mesmo PR cancela a execução anterior; na main, cada commit roda até o fim.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm (versão do packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node (versão do .nvmrc) com cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Postgres de teste (com os papéis bairrin_migracao e bairrin_app do script de init) e
      # Mailpit, pelo mesmo docker-compose do desenvolvimento. Não é `services:` do GitHub de
      # propósito: lá não dá para montar infra/postgres/init antes do container subir, e o
      # script de init é o que cria os papéis que os testes de permissão exercitam (S3).
      # Sobe em segundo plano no começo para ficar pronto até a hora dos testes de integração.
      - name: Subir Postgres de teste e Mailpit
        run: docker compose -f infra/docker-compose.yml up -d postgres-teste mailpit

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Fronteiras entre camadas e módulos
        run: pnpm deps:verificar

      - name: Migrações
        run: pnpm migracoes:verificar

      - name: Testes unitários
        run: pnpm test

      - name: Esperar Postgres de teste e Mailpit
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres-teste mailpit

      - name: Testes de integração
        run: pnpm test:integracao

      # API, pacotes e painel (vite build).
      - name: Build
        run: pnpm build

      # CA-F6: entram sozinhos quando os apps existirem (apps/consumidor e apps/lojista ainda não
      # foram criados: aguardam o Expo SDK 58 estável).
      - name: Expo export do consumidor
        if: hashFiles('apps/consumidor/app.config.ts') != ''
        run: |
          pnpm --filter consumidor exec expo export --platform android
          pnpm --filter consumidor exec expo export --platform ios

      - name: Expo export do lojista
        if: hashFiles('apps/lojista/app.config.ts') != ''
        run: |
          pnpm --filter lojista exec expo export --platform android
          pnpm --filter lojista exec expo export --platform ios

      - name: Logs dos containers (se falhar)
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

  auditoria:
    # Bloqueante (S12): vulnerabilidade alta ou crítica em dependência de produção reprova o PR.
    name: Auditoria de dependências
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm (versão do packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node (versão do .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Lê só o pnpm-lock.yaml; não instala nada.
      - name: pnpm audit (produção, alta ou crítica)
        run: pnpm audit --prod --audit-level=high
