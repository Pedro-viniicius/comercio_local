# Build Android nativo na main (CA-F8, ADR-013): `expo prebuild` + Gradle para os dois apps.
# Confere que o código nativo gerado compila; a publicação nas lojas é pelo EAS Build, fora daqui.
# Sem segredos: o APK de release sai assinado com a chave de debug que o prebuild gera, serve só
# para teste interno e fica 7 dias como artefato da execução.
#
# Os apps são apps/consumidor e apps/lojista (Expo SDK 58). Sem atalho: se a pasta ou o config de
# um deles sumir, o job falha em vez de passar em silêncio.
#
# Actions fixadas pelo SHA do commit (a versão fica no comentário); o Dependabot as atualiza.
name: Android nativo

on:
  push:
    branches: [main]
  # Sob demanda, se faltar minuto de CI ou para repetir um build.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Só o build do commit mais recente da main interessa.
  group: android-nativo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [consumidor, lojista]
    env:
      # Endereço público da API embutido no app (não é segredo).
      EXPO_PUBLIC_API_URL: https://api.bairrin.com.br
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm (versão do packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node (versão do .nvmrc) com cache do pnpm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Sem `cache: gradle`: a chave do cache vem dos arquivos do Gradle, que só existem depois do
      # `expo prebuild` (a pasta android/ não está no git), e o setup-java falha sem eles.
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Gera apps/<app>/android (fora do git) a partir do app.config.ts. O SDK do Android já vem
      # na imagem do runner (ANDROID_HOME).
      - name: expo prebuild
        run: pnpm --filter ${{ matrix.app }} exec expo prebuild --platform android --clean --no-install

      # Cache do Gradle depois do prebuild, quando os arquivos que formam a chave já existem (R19).
      # Uma chave por app; só a main e o disparo manual gravam o cache.
      - name: Cache do Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ matrix.app }}-${{ hashFiles(format('apps/{0}/android/**/*.gradle*', matrix.app), format('apps/{0}/android/**/gradle-wrapper.properties', matrix.app), 'pnpm-lock.yaml') }}
          restore-keys: |
            gradle-${{ runner.os }}-${{ matrix.app }}-

      - name: Gradle assembleRelease
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar o APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-android-release
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
