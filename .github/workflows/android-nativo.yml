# Build Android nativo na main (CA-F8, ADR-013): `expo prebuild` + Gradle para os dois apps.
# Confere que o código nativo gerado compila; a publicação nas lojas é pelo EAS Build, fora daqui.
# Sem segredos: o APK de release sai assinado com a chave de debug que o prebuild gera, serve só
# para teste interno e fica 7 dias como artefato da execução.
#
# Os apps (apps/consumidor e apps/lojista) ainda não existem: aguardam o Expo SDK 58 estável.
# Enquanto não existirem, cada job só registra um aviso e termina sem build.
#
# Actions fixadas pelo SHA do commit (a versão fica no comentário); o Dependabot as atualiza.
name: Android nativo

on:
  push:
    branches: [main]
  # Sob demanda, se faltar minuto de CI ou para repetir um build.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Só o build do commit mais recente da main interessa.
  group: android-nativo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [consumidor, lojista]
    env:
      # Endereço público da API embutido no app (não é segredo).
      EXPO_PUBLIC_API_URL: https://api.bairrin.com.br
    steps:
      - name: Código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conferir se o app existe
        id: app
        run: |
          if [ -f "apps/${{ matrix.app }}/app.config.ts" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::apps/${{ matrix.app }} ainda não existe; build Android pulado."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: pnpm (versão do packageManager)
        if: steps.app.outputs.existe == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Node (versão do .nvmrc) com cache do pnpm
        if: steps.app.outputs.existe == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Java 17 com cache do Gradle
        if: steps.app.outputs.existe == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar dependências
        if: steps.app.outputs.existe == 'true'
        run: pnpm install --frozen-lockfile

      # Gera apps/<app>/android (fora do git) a partir do app.config.ts. O SDK do Android já vem
      # na imagem do runner (ANDROID_HOME).
      - name: expo prebuild
        if: steps.app.outputs.existe == 'true'
        run: pnpm --filter ${{ matrix.app }} exec expo prebuild --platform android --clean --no-install

      - name: Gradle assembleRelease
        if: steps.app.outputs.existe == 'true'
        working-directory: apps/${{ matrix.app }}/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar o APK
        if: steps.app.outputs.existe == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.app }}-android-release
          path: apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
